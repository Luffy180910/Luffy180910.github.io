<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower of Hanoi · Luffy's Space</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/site/base.css">
    <link rel="stylesheet" href="/assets/site/pages/blog__Hanoi__index.css">
</head>
<body>

<div class="wrap">
    <div class="cyber-hero">
        <h1>Tower of Hanoi</h1>
        <p class="subtitle">经典递归算法可视化</p>
    </div>

    <div class="hanoi-controls">
        <label for="diskCount">盘子数量：</label>
        <input type="number" id="diskCount" value="5" min="1" max="10">
        <button onclick="startSolve()">开始求解</button>
    </div>

    <img src="./tower-of-hanoi.png" alt="Tower of Hanoi" style="display:block;margin:var(--space-md) auto;max-width:300px;">

    <div class="hanoi-rules">
        <h3>规则</h3>
        <ul>
            <li>每次只能移动一个盘子</li>
            <li>大盘子不能放在小盘子上面</li>
            <li>将所有盘子从 A 柱移动到 C 柱</li>
        </ul>
    </div>

    <div id="print" class="hanoi-output"></div>
</div>

<script>
    let Tower = [[], [], []];
    let TempTower = [[], [], []];
    var n = 5;

    function move(m, a, b, c) {
        if (m === 1) {
            headmove(a, c);
            draw(n);
            document.getElementById("print").innerHTML += "<li>--------------------------------------------------------------------------</li><br>";
            return;
        }
        move(m - 1, a, c, b);
        headmove(a, c);
        draw(n);
        document.getElementById("print").innerHTML += "<li>--------------------------------------------------------------------------</li><br>";
        move(m - 1, b, a, c);
    }

    function headmove(a, c) {
        if (Tower[a].length === 0) return;
        let temp = Tower[a].pop();
        Tower[c].push(temp);
        document.getElementById("print").innerHTML += "<li>将 " + temp + " 从柱子 " + (a + 1) + " 移动到柱子 " + (c + 1) + "</li><br>";
    }

    function draw(n) {
        let str = "<pre>";
        let tempTower = [[], [], []];
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < Tower[i].length; j++) {
                tempTower[i][j] = Tower[i][j];
            }
        }
        for (let i = n - 1; i >= 0; i--) {
            for (let j = 0; j < 3; j++) {
                if (tempTower[j].length > i) {
                    let num = tempTower[j][i];
                    let spaces = n - num;
                    str += "&nbsp;".repeat(spaces) + "1".repeat(num * 2 - 1) + "&nbsp;".repeat(spaces);
                } else {
                    str += "&nbsp;".repeat(n) + "|" + "&nbsp;".repeat(n - 1);
                }
                str += "&nbsp;&nbsp;";
            }
            str += "<br>";
        }
        str += "&nbsp;".repeat(n - 1) + "A" + "&nbsp;".repeat(n * 2) + "B" + "&nbsp;".repeat(n * 2) + "C<br></pre>";
        document.getElementById("print").innerHTML += str;
    }

    function startSolve() {
        n = parseInt(document.getElementById("diskCount").value) || 5;
        if (n < 1) n = 1;
        if (n > 10) n = 10;
        Tower = [[], [], []];
        for (let i = n; i >= 1; i--) {
            Tower[0].push(i);
        }
        document.getElementById("print").innerHTML = "";
        draw(n);
        move(n, 0, 1, 2);
    }

    window.onload = function () {
        Tower = [[], [], []];
        for (let i = n; i >= 1; i--) {
            Tower[0].push(i);
        }
        draw(n);
    };
</script>

<script src="/assets/js/nav.js"></script>
</body>
</html>
